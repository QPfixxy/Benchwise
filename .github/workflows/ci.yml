name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # GitHub's Linux runners can't use Chromium's SUID sandbox.
      ELECTRON_DISABLE_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Cache smartctl build
        uses: actions/cache@v4
        with:
          path: vendor
          key: smartctl-${{ runner.os }}-${{ hashFiles('scripts/vendor-smartctl.js') }}
      - name: Bundle smartctl (drive health)
        run: node scripts/vendor-smartctl.js

      - name: Smoke test (real hardware scan + PDF)
        shell: bash
        run: |
          mkdir -p ci-out/smoke
          cmd="node scripts/electron.js --smoke-test=ci-out/smoke"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a $cmd; else $cmd; fi

      - name: UI check (renders every page, saves a report, fails on console errors)
        shell: bash
        env:
          BENCHWISE_DATA_DIR: ci-out/ui/data
        run: |
          mkdir -p ci-out/ui
          cmd="node scripts/electron.js --ui-check=ci-out/ui"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a $cmd; else $cmd; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchwise-${{ matrix.os }}
          path: ci-out/

  hub:
    # Benchwise Hub: unit tests everywhere it should run, plus the integration
    # tests against a real PostgreSQL on Linux (the main server platform).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: hubtest
          POSTGRES_PASSWORD: hubtest
          POSTGRES_DB: hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hubtest" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - name: Tests
        shell: bash
        env:
          HUB_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgres://hubtest:hubtest@localhost:5432/hub_test' || '' }}
        run: npm test
