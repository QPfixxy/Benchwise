      <a href="/io" class="active" >IO Interfaces</a>

    <div class="test-nav">
      <button onclick="navigateTests(-1)">← Back</button>
      <button data-target="Camera" class="active">Camera</button>
      <button data-target="Keyboard">Keyboard</button>
      <button data-target="Audio">Audio/Mic</button>
      <button data-target="test4">Test 4</button>
      <button onclick="navigateTests(1)">Forward →</button>

    <div id="Camera" class="test-content">
      <h2 class="centered-header">Webcam Test</h2>
      <div class="video-controls">
        <button id="toggle-button">Turn Camera Off</button>
        <select id="camera-select"></select>
      </div>
      <video id="video" width="640" height="480" autoplay playsinline></video>
      <br>
    </div>
    <div id="Keyboard" class="test-content" style="display:none;">Test 2 content here...</div>
    <div id="Audio" class="test-content" style="display:none;">
      <h2 class="centered-header">Microphone Test</h2>
      <div class="audio-controls">
        <button id="record-button">Record</button>
        <button id="play-button" disabled>Play</button>
        <div id="status-bar" style="width: 100%; height: 20px; background-color: gray;"></div>
      </div>
      <audio id="audio-playback" controls style="display: none;"></audio>
      <div class="speaker-test">
        <h2 class="centered-header">Speaker Test</h2>
        <button id="test-speaker-button">Test Speakers</button>
        <div id="progress-container" style="width: 100%; background-color: #ddd;">
          <div id="progress-bar" style="width: 0%; height: 20px; background-color: #4CAF50;"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
  switchTest('Camera'); // Initialize page
});

document.querySelectorAll('.test-nav button[data-target]').forEach(button => {
  button.addEventListener('click', function() {
    switchTest(this.getAttribute('data-target'));
  });
});

function switchTest(testId) {
  document.querySelectorAll('.test-content').forEach(content => content.style.display = 'none');
  
  const target = document.getElementById(testId);
  target.style.display = 'block';
  
  document.querySelectorAll('.test-nav button').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-target') === testId);
  });
}

function navigateTests(direction) {
  const currentActive = document.querySelector('.test-nav button.active');
  const tests = Array.from(document.querySelectorAll('.test-nav button[data-target]'));
  let currentIndex = tests.indexOf(currentActive);
  currentIndex += direction;

  if (currentIndex >= tests.length) currentIndex = 0;
  if (currentIndex < 0) currentIndex = tests.length - 1;

  switchTest(tests[currentIndex].getAttribute('data-target'));
}

document.addEventListener('DOMContentLoaded', () => {
  switchTest('Camera'); 
  setupWebcam(); 
});

function setupWebcam() {
  const video = document.getElementById('video');
  const toggleButton = document.getElementById('toggle-button');
  const cameraSelect = document.getElementById('camera-select');

  async function startVideoStream(deviceId) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId } });
      video.srcObject = stream;
    } catch (error) {
      console.error('Error accessing video stream:', error);
    }
  }

  navigator.mediaDevices.enumerateDevices()
    .then(devices => {
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      videoDevices.forEach(device => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Camera ${cameraSelect.options.length + 1}`;
        cameraSelect.appendChild(option);
      });
      if (videoDevices.length > 0) {
        startVideoStream(videoDevices[0].deviceId); 
      }
    })
    .catch(error => {
      console.error('Error enumerating devices:', error);
    });

  let isCameraOn = true;
  toggleButton.addEventListener('click', () => {
    if (isCameraOn) {
      video.srcObject.getTracks().forEach(track => track.stop());
      toggleButton.textContent = 'Turn Camera On';
    } else {
      const selectedDeviceId = cameraSelect.value;
      startVideoStream(selectedDeviceId);
      toggleButton.textContent = 'Turn Camera Off';
    }
    isCameraOn = !isCameraOn;
  });
}

document.addEventListener('DOMContentLoaded', () => {
  resetStatusBar();
  setupEventListeners();
});

function setupEventListeners() {
  document.getElementById('record-button').addEventListener('click', startRecording);
  document.getElementById('play-button').addEventListener('click', playRecording);
}

let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let audioContext, source, analyser, bufferLength, dataArray;

function startRecording() {
  if (!isRecording) {
    isRecording = true;
    document.getElementById('record-button').textContent = 'Stop';
    document.getElementById('play-button').disabled = true;
    audioChunks = [];

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = finalizeRecording;
        mediaRecorder.start();
        setupAudioProcessing(stream);

        setTimeout(() => {
          if (isRecording) {
            stopRecording();
          }
        }, 10000); //timer
      })
      .catch(error => console.error('Error accessing audio stream:', error));
  } else {
    stopRecording();
  }
}

function stopRecording() {
  if (isRecording) {  
    mediaRecorder.stop();
    document.getElementById('record-button').textContent = 'Record';
    isRecording = false;
  }
}

function setupAudioProcessing(stream) {
  audioContext = new AudioContext();
  source = audioContext.createMediaStreamSource(stream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  source.connect(analyser);
  updateAudioVisuals();
}

function updateAudioVisuals() {
  if (!isRecording) return;
  requestAnimationFrame(updateAudioVisuals);
  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  let max = 0;
  for (let i = 0; i < bufferLength; i++) {
    let value = dataArray[i] - 128;
    sum += Math.abs(value);
    max = Math.max(max, Math.abs(value));
  }
  let average = sum / bufferLength;
  const statusBar = document.getElementById('status-bar');
  statusBar.style.backgroundColor = average < 2 ? 'gray' : max > 60 ? 'red' : 'green';
}

function finalizeRecording() {
  const audioBlob = new Blob(audioChunks);
  const audioUrl = URL.createObjectURL(audioBlob);
  const audio = document.getElementById('audio-playback');
  audio.src = audioUrl;
  document.getElementById('play-button').disabled = false;
  resetStatusBar();
  source.disconnect();
  analyser.disconnect();
  audioContext.close();
}

function stopRecording() {
  mediaRecorder.stop();
  document.getElementById('record-button').textContent = 'Record';
  isRecording = false;
}

function playRecording() {
  const audio = document.getElementById('audio-playback');
  audio.play();
}

function resetStatusBar() {
  const statusBar = document.getElementById('status-bar');
  statusBar.style.backgroundColor = 'gray';
}

document.addEventListener('DOMContentLoaded', function() {
  const audioElement = document.createElement('audio');
  audioElement.src = './resources/audio.m4a'; 
  let isPlaying = false;

  const testButton = document.getElementById('test-speaker-button');
  const progressBar = document.getElementById('progress-bar');
  
  testButton.addEventListener('click', () => {
    if (!isPlaying) {
      audioElement.play().catch(error => console.error('Error playing test sound:', error));
      testButton.textContent = 'Stop Test';
      isPlaying = true;
    } else {
      audioElement.pause();
      audioElement.currentTime = 0;
      testButton.textContent = 'Test Speakers';
      isPlaying = false;
      progressBar.style.width = '0%'; 
    }
  });

  audioElement.addEventListener('timeupdate', () => {
    const progress = (audioElement.currentTime / audioElement.duration) * 100;
    progressBar.style.width = `${progress}%`;
  });

  audioElement.addEventListener('ended', () => {
    testButton.textContent = 'Test Speakers';
    isPlaying = false;
    progressBar.style.width = '0%'; 
  });
});


  </script>
