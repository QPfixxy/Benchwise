<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Testing Suite</title>
  <link rel="stylesheet" href="css/io.css">
  <style>
  </style>
</head>
<body>
  </div>

  <div class="container">
    <img src="https://edge.sitecorecloud.io/ironmountain-c8dd68e9/media/project/iron-mountain/iron-mountain/test-images/logo-full-color.svg?iar=0&sc_lang=en" alt="Company Logo" class="logo">
    <h1>Hardware Testing Suite</h1>
    <div class="navigation">
      <a href="/index.html">System Spec</a>
      <a href="/io" class="active" >IO Interfaces</a>
      <a href="/hardware" >Hardware</a>
      <a href="/tools">Tools</a>
    </div>

    <div class="test-nav">
      <button onclick="navigateTests(-1)">← Back</button>
      <button data-target="Camera" class="active">Camera</button>
      <button data-target="Keyboard">Keyboard</button>
      <button data-target="Audio">Audio/Mic</button>
      <button data-target="touchscreen">Touch Screen</button>
      <button data-target="Ports">Ports</button>
      <button onclick="navigateTests(1)">Forward →</button>
    </div>
    
    <div id="Camera" class="test-content">
      <h2 class="centered-header">Webcam Test</h2>
      <div class="video-controls">
        <button id="toggle-button">Turn Camera Off</button>
        <select id="camera-select"></select>
      </div>
      <video id="video" width="640" height="480" autoplay playsinline></video>
      <br>
    </div>
    <div id="Keyboard" class="test-content" style="display:none;">keyboard.</div>
    
    <div id="Audio" class="test-content hidden">
      <h2 class="centered-header">Microphone Test</h2>
      <div class="bar-container">
          <div id="status-bar" class="status-bar"></div>
      </div>
      <div class="button-container centered">
          <button id="record-button">Record</button>
          <button id="play-button" disabled>Play</button>
      </div>
      <audio id="audio-playback" class="hidden"></audio>
  
      <h2 class="centered-header">Speaker Test</h2>
      <div class="bar-container">
          <div id="progress-container" class="progress-container">
              <div id="progress-bar" class="progress-bar"></div>
          </div>
      </div>
      <div class="button-container centered">
          <button id="test-speaker-button">Test Speakers</button>
      </div>
    </div>  
  
    <div id="touchscreen" class="test-content" style="display:none;">
      <h2 class="centered-header">Touch Screen Test</h2>
      <div class="touch-area" id="touch-area">
        <button class="button start-button" onclick="startTest()">Start Test</button>
      </div>
    </div>

    <div id="Ports" class="test-content" style="display:none;">Ports.</div>


    <script src="./resources/JavaScript/camera.js"></script>
  <script src="./resources/JavaScript/touchscreen.js"></script>
  <script src="./resources/JavaScript/audio.js"></script>
</body>
</html>
