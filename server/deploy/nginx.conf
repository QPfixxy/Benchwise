# Benchwise Server: TLS in front of the service (which listens on 127.0.0.1:8080).
# Installed as /etc/nginx/sites-available/benchwise-server by install.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # HTTP only redirects; nothing is served unencrypted.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/benchwise-server/tls/server.crt;
    ssl_certificate_key /etc/benchwise-server/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:benchwise:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Audit uploads carry a PDF (the service enforces its own limit too).
    client_max_body_size 30m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
