# Benchwise Server on two networks (installed by install.sh --company-ip/--floor-ip).
#   Company side (__COMPANY_IP__): staff web pages, search, exports, administration
#   Floor side   (__FLOOR_IP__):   station uploads only (units under test live here)
# Each side reaches a different internal listener, so a floor device can never
# reach the staff pages, even by guessing URLs.


server {
    listen __COMPANY_IP__:80;
    listen __FLOOR_IP__:80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Company side: staff
server {
    listen __COMPANY_IP__:443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/benchwise-server/tls/server.crt;
    ssl_certificate_key /etc/benchwise-server/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:benchwise:10m;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Floor side: stations
server {
    listen __FLOOR_IP__:443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/benchwise-server/tls/server.crt;
    ssl_certificate_key /etc/benchwise-server/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:benchwise:10m;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
